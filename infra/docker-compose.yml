services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ollive
      POSTGRES_PASSWORD: ollive
      POSTGRES_DB: ollive
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollive"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    ports: ["4222:4222", "8222:8222"]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://ollive:ollive@postgres:5432/ollive?sslmode=disable
      NATS_URL: nats://nats:4222
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  ingestion-worker:
    build:
      context: ..
      dockerfile: services/ingestion-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://ollive:ollive@postgres:5432/ollive?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  frontend:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
