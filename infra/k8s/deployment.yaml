apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollive-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: ollive-api }
  template:
    metadata:
      labels: { app: ollive-api }
    spec:
      containers:
        - name: api
          image: ollive-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: ollive-config }
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: llm-secrets, key: OPENAI_API_KEY }
          ports: [{ containerPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollive-ingestion-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollive-ingestion-worker }
  template:
    metadata:
      labels: { app: ollive-ingestion-worker }
    spec:
      containers:
        - name: worker
          image: ollive-ingestion-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: ollive-config }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollive-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollive-web }
  template:
    metadata:
      labels: { app: ollive-web }
    spec:
      containers:
        - name: web
          image: ollive-web:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
